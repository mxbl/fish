# General {{{
set -g default-terminal 'tmux-256color'
set -sg escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set-option -g allow-rename off
set-option -g set-titles on
set-option -g set-titles-string "#T - #W"
setw -g monitor-activity off
set -g visual-activity off
set -g default-shell '/usr/bin/fish'
set -s extended-keys on
#set -as terminal-features 'tmux-*:extkeys'

# display messages for 5 seconds
# e.g. usage $ some-command ; tmux display-message "We're done here"
set -g display-time 1000
# }}}
# Mouse {{{
setw -g mouse on
# }}}
# Vim Behaviour {{{
setw -g mode-keys vi
set-option -g status-keys vi
set-window-option -g mode-keys vi
# }}}
# Statusline / Colorscheme {{{
set -g status-interval 1
set -g status-justify left
set -g status-keys vi
set -g status-position bottom
set -g status-style 'fg=#888888,bg=#222222 dim'

# Left Status │
#set -g status-left "|> #[fg=colour43]#[fg=colour42]#S#[fg=colour43]@#[fg=colour37]#h.#(dnsdomainname)#[fg=colour39]│ "
#set -g status-left "|>@#h.#(dnsdomainname)   "
set -g status-left " #[fg=#00b8f6,bold]|>#S@#[fg=#888888,bold](#h.#(dnsdomainname))  "
set -g status-left-style fg="#87ff00",bold
set -g status-left-length 35

# Right Status
set -g status-right '#[fg=#00b8f6](BAT=#(cat /sys/class/power_supply/BAT0/capacity)%)#[fg=#888888]:#[fg=colour141]#{client_pid}#[fg=#888888]:#{pane_id}:#[fg=#87ff00,bold]#{pane_current_path} '
set -g status-right-length 120

# Pane border styles
set -g pane-active-border-style fg=#399cbd
set -g pane-border-style fg=#222222

set-window-option -g window-status-separator " │ " #"│"
set-window-option -g window-status-current-format " #[fg=colour141,bold]#I•#[fg=#87ff00,bold]#W#F " #"  #W#F  "
set-window-option -g window-status-format "#[fg=colour141,bold]#I•#[fg=#888888](#W#F)"
## OLD, DELETEME
#set-window-option -g window-status-current-style fg=#87ff00,bold
#set-window-option -g window-status-style " #[fg=colour141,bold]#I•#[fg=#888888]#W#F "
#set-window-option -g window-active-style bg=default
# }}}
# Keybindings/prefix {{{
set-option -g prefix C-b
bind C-b send-prefix
# }}}
# Keybindings/copy-mode {{{
bind C-f copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"
#bind p run "xclip -o | tmux load-buffer - ; tmux paste-buffer"
bind p run "wl-paste | tmux load-buffer - ; tmux paste-buffer"
# }}}
# Keybindings/sessions {{{
bind N new-session
bind t new-window -n sessionizer tmux_sessionizer
bind . switch-client -l
# }}}
# Keybindings/windows {{{
bind n new-window
# FIXME: delete if there are no issues with the ctrl version above
#   - ok there are issues, tab acts like C-u ??
#bind-key -n -r 'C-u' select-window -t :-
#bind-key -n -r 'C-i' select-window -t :+
bind -n -r 'M-u' select-window -t :-
bind -n -r 'M-i' select-window -t :+
bind -n -r 'M-U' swap-window -t -1 \; select-window -t -1
bind -n -r 'M-I' swap-window -t +1 \; select-window -t +1
# }}}
# Keybindings/panes and layouts {{{
bind q kill-pane
bind Q kill-session

bind-key -n 'C-h' run-shell '~/.tmux.vim-select-pane.sh -L'
bind-key -n 'C-j' run-shell '~/.tmux.vim-select-pane.sh -D'
bind-key -n 'C-k' run-shell '~/.tmux.vim-select-pane.sh -U'
bind-key -n 'C-l' run-shell '~/.tmux.vim-select-pane.sh -R'

# Bring back clear screen under tmux with prefix
bind-key C-l send-keys 'C-l'

# create pane in hjkl-direction
bind l split-window -h -c    '#{pane_current_path}'
bind h split-window -h -b -c '#{pane_current_path}'
bind j split-window -v -c    '#{pane_current_path}'
bind k split-window -v -b -c '#{pane_current_path}'

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# bind -r g resize-pane 5
# bind-key -n 'M-h' resize-pane -L 5
# bind-key -n 'M-l' resize-pane -R 5

# Toggle zoom
# bind-key -n C-Space resize-pane -Z
bind-key -n M-f resize-pane -Z

# Override select session with tree choose
bind s choose-tree

# Toggle status bar
bind b set -g status

# }}}
# Keybindings/reload config {{{
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"
# }}}
# vim: fdm=marker
